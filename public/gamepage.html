<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Quest| Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./gamePage.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body style="background-color: #FFEEBB;">

    <nav class="navbar navbar-expand-md quest-nav">
        <div class="container-fluid px-md-5">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav w-100 justify-content-between">
                    <li class="nav-item"><a class="nav-link" href="login.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="subjectpage.html">Subjects</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Classroom</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Stats</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class container py-3>

      <nav>
        <ol class="quiz-context list-unstyled d-flex justify-content-center mb-4">
          <li class="context-pill">History</li>
          <li class="context-pill">Quizzes</li>
          <li class="context-pill">WWII</li>
        </ol>
      </nav>

      <section class="quiz mx-auto">

        <div class="question-row">
            <img id="question-image" class="question-image" src="./assets/images/question1.jpg">
            <button id="next-btn" class="next-button" type="button" hidden>Next Question</button>
        </div>
    
        <h2 id="question-text" class="question-text">1. In which year did World War II begin?</h2>

        <form id="answer-form" class="answer-form" autocomplete="off">
            <label for="answer-input" class="visually-hidden">Your answer</label>
            <input type="text" id="answer-input" class="form-control form-control-lg answer-input" placeholder="Enter a year" required>
            <button type="submit" id="submit-btn" class="btn btn-submit rounded pill">Submit</button> 
        </form>

        <div id="correct-card" class="correct-card" hidden>
            <p id="feedback"></p>
            <p id="fun-fact"></p>
        </div>
      </section>
    </main>
</body>
</html>
