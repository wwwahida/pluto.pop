<!DOCTYPE html>

<head>

    <title>Study Quest | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body style="background-color: #FFEEBB;">
    <nav class="navbar navbar-expand-md quest-nav">
        <div class="container-fluid px-md-5">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav w-100 justify-content-between">
                    <li class="nav-item"><a class="nav-link" href="">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Subjects</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Classroom</a></li>

                    <li class="nav-item"><a class="nav-link" href="">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

<main class="container-fluid px-md-5 py-4">
    <div class="row justify-content-center g-5">
        <div class="col-sm-6 col-lg-6">
                <div class ="subject-card">
                    <h1 class="subject-heading">History</h1>
                </div>
                <div class ="subject-card flex-column align-items-start mt-4 rounded-4 borderColor=#e4e8ef">

                     <div class="col-sm-6 col-lg-6">
                        <button type="button" class="btn btn-quest btn-lg mt-3">World War I</button>

                </div>
        </div>

            </div>
            <section class="subject-card flex-column align-items-start mt-4 rounded-4 border">

                <button type="button" class="btn btn-quest btn-lg mt-3">World War II Quiz</button>
                <button type="button" class="btn btn-quest btn-lg mt-3">Spot the flag!</button>
